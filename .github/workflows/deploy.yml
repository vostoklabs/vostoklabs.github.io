name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The same checks a pull request gets: public-repo, page frame, UI drift, typecheck, every
  # test suite. The site used to deploy in parallel with them, so a red check reported a
  # failure that was already live.
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  build-and-deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Every export names the build it came from (Metadata/vostok_labs.txt, the SVG metadata).
      # Unset, the live site stamped "dev" into every file.
      VITE_BUILD_ID: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Hub
        run: pnpm build:hub

      - name: Build Name Keychain
        run: pnpm build:keychain

      - name: Copy Name Keychain to Hub Dist
        run: cp -r apps/name-keychain/dist apps/hub/dist/name-keychain

      - name: Build Clicker Generator
        run: pnpm build:clicker

      - name: Copy Clicker Generator to Hub Dist
        run: |
          cp -r apps/clicker-generator/dist apps/hub/dist/Clicker-Generator
          cp -r apps/clicker-generator/dist apps/hub/dist/clicker

      - name: Build Keycap Generator
        run: pnpm build:keycap

      - name: Copy Keycap Generator to Hub Dist
        run: |
          cp -r apps/keycap-generator/dist apps/hub/dist/SVG-keycap-generator
          cp -r apps/keycap-generator/dist apps/hub/dist/keycap

      - name: Build Magnet Generator
        run: pnpm build:magnet

      - name: Copy Magnet Generator to Hub Dist
        run: cp -r apps/magnet-generator/dist apps/hub/dist/magnet

      - name: Build House Number Generator
        run: pnpm build:housenumber

      - name: Copy House Number Generator to Hub Dist
        run: cp -r apps/house-number/dist apps/hub/dist/house-number

      - name: Build Pen Topper Generator
        run: pnpm build:penTopper

      - name: Copy Pen Topper Generator to Hub Dist
        run: cp -r apps/pen-topper/dist apps/hub/dist/pen-topper

      # Default build: the one the hub serves.
      - name: Build Fold-Up Box Generator (print-only)
        run: pnpm build:foldbox

      - name: Copy Fold-Up Box Generator to Hub Dist
        run: cp -r apps/foldbox/dist apps/hub/dist/foldbox

      - name: Build Keychain Carabiner Set
        run: pnpm build:keychainCarabiner

      - name: Copy Keychain Carabiner Set to Hub Dist
        run: cp -r apps/keychain-carabiner/dist apps/hub/dist/keychain-carabiner

      # Default build: MakerWorld-only modules are stubbed in this build. The MakerWorld build
      # is `build:mw`, and it writes to dist-mw/, never here.
      - name: Build Laser Studio
        run: pnpm build:laserStudio

      - name: Copy Laser Studio to Hub Dist
        run: cp -r apps/laser-studio/dist apps/hub/dist/laser-studio

      # Default build, like Laser Studio's: the MakerWorld build is `build:mw` into dist-mw/.
      - name: Build Laser Box
        run: pnpm build:laserBox

      - name: Copy Laser Box to Hub Dist
        run: cp -r apps/laser-box/dist apps/hub/dist/laser-box

      # Every generator the hub links to has to exist under the path generators.json gives it,
      # or the card is a 404 — which is exactly what shipped: the app was written, the registry
      # entry was added, and nothing here ever built it. Cheap to assert, and it fails the
      # deploy instead of the visitor.
      - name: Check every app route the hub links to exists
        run: |
          node -e '
            const fs = require("fs");
            const reg = JSON.parse(fs.readFileSync("generators.json", "utf8"));
            const missing = reg.generators
              .filter((g) => g.status === "live" && g.appUrl && !g.external)
              .map((g) => g.appUrl.replace(/^\/|\/$/g, ""))
              .filter((p) => !fs.existsSync(`apps/hub/dist/${p}/index.html`));
            if (missing.length) {
              console.error("No build at: " + missing.join(", "));
              process.exit(1);
            }
            console.log("All app routes present.");
          '

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/hub/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
