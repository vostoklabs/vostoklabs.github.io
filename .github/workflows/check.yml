name: Check

# The deploy workflow only builds the apps the hub links to, so nothing was watching the
# generator template — the thing every new generator is copied from. A template that has
# quietly stopped building is worse than no template: the next scaffold starts broken and
# gets hand-rolled instead, which is how generators drifted apart in the first place.
#
# The deploy runs this workflow first and ships only if it passes (deploy.yml). A push to
# master is therefore checked there, not here as well, or it would be checked twice.
#
# Third-party actions are pinned to a commit, with the release it was in the comment beside
# it. A tag can be moved to different code; a commit cannot.

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This repo is public: refuse text that must not be published (.claude/rules/public-repo.md).
      - name: Public-repo check
        run: pnpm check:public
        env:
          PUBLIC_CHECK_TERMS: ${{ secrets.PUBLIC_CHECK_TERMS }}

      # The page frame lives in @vostok/ui-kit and nowhere else (invariant #9).
      - name: Page-frame check
        run: pnpm check:chrome

      # Controls come from the kit, not from a hand-written <button> (invariant #9). A
      # ratchet per app, not a gate: it fails when a count goes up, never for the backlog it
      # inherited. Also hard-fails on a dead class or an unresolvable token, either of
      # which renders wrong and reports nothing.
      - name: UI drift check
        run: pnpm check:ui

      # Every value a package exports is in its catalogue.json, under a plain name with a line on
      # what it is for, and every UI block is shown in kit-demo. `pnpm catalogue` is how the next
      # app finds a block instead of writing it again.
      - name: Catalogue check
        run: pnpm check:catalogue

      # An app re-writing what the shelf already has, an import pointing the wrong way (a core that
      # knows about a machine, an app reaching into another), the same code in two places.
      # Ratchets per app, like the UI drift check: a count may fall, never rise.
      - name: Shelf checks
        run: |
          pnpm check:blocks
          pnpm check:layers
          pnpm check:copies

      # The licence and third-party notice files are generated; a stale one ships the wrong terms.
      - name: Licence and notice files are current
        run: |
          pnpm check:licenses
          pnpm check:notices

      # Every font, typeface, symbol, pattern and model file is claimed by a row of assets.json
      # under an allowed licence (invariant #6), and says nothing inside that contradicts it.
      - name: Asset licences
        run: pnpm check:assets

      - name: Typecheck every package and app
        run: pnpm typecheck

      # Every suite in the repo. A test that does not run in CI is a test nobody notices
      # going stale: two of the clicker's had been failing for a week, unseen.
      - name: Tests
        run: pnpm test

      # The template has to build, or `pnpm new:generator` hands someone a broken app.
      - name: Build the generator template
        run: pnpm build:template

      # kit-demo shows every UI block: the visual half of the catalogue.
      - name: Build kit-demo
        run: pnpm build:demo
