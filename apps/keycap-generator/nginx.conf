server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative base './' in the Vite build -> serve assets wherever the app lives.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Static-heavy assets: long cache.
    location ~* \.(wasm|json|3mf|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}