Six styles need no glue at all, and each carries the ECMA code of the trade structure it is built from. The mailer (ECMA B20.01.00.50) locks itself by rolling each end down over the corner ears and pushing two tabs through the floor; the webbed tray (B20.04.00.00) locks by folding each corner double on a 45° crease instead.

The gable box (A55.75.01.03) is the handled one: two roof panels lean in to a ridge, the two handle blades meet face to face above it, and an ear at each end drops its slot over BOTH blades at once — that notch in the blades’ shoulders is the lock. It needs the one glued lap every tube box needs, and nothing else.

To hang a box on a shop peg, the hang tab adds a euro slot (ISO 15348). A header above the back wall doubled over on itself puts the slot through two plies, which is what stops it tearing off the peg — and it moves the lid to the front, because the header now owns the back wall’s top edge.

CUTTING IT. The one number that matters is how thick your card actually is: every tab, slot and lid clearance is built from it. The number on the packet is not it — 300 gsm runs anywhere from 0.30 to 0.46 mm. Stack ten sheets, measure, divide by ten.

PRINTING IT. The thickness is worked out for you: layers times layer height. Two layers of 0.2 mm is 0.40 mm, which is exactly what 300 gsm card measures — so it folds like card. Fold lines come out as grooves down to one layer.

Boxes eat a lot of paper — far more than anyone expects. If the blank does not fit, press "Resize to fit" rather than hunting for the number by hand. On A4 or a Cricut mat this is a small-box tool.

No cutter can crease, so fold lines come out as a laser score, a perforation, or a pen line you fold by hand. The machine preset picks the right one.
